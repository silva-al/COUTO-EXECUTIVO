            /* ========================================================
       COUTO EXECUTIVO — CINEMATIC JOURNEY (EXATAMENTE COMO O CÓDIGO DO USUÁRIO)
       ======================================================== */
    (function initCinematicFilm() {
      const film = document.getElementById('film');
      if (!film) return;

      film.innerHTML = '<div class="bar" id="bar"></div><div class="hud"><span>Couto Executivo</span><span id="hud">Executivo individual</span></div>';

      const S = [
        { k: "individual", n: "Executivo individual", t: "Do aeroporto à reunião, sem pressa e sem imprevistos.", d: "Motorista recebe a passageira no aeroporto.", p: [30, 75], h: 100 },
        { k: "balada", n: "Balada e eventos", t: "Saia tranquilo. Quem dirige é o motorista.", d: "Motorista recebe a convidada na entrada do evento.", p: [25, 75], h: 100 },
        { k: "rodeio", n: "Rodeio", t: "Chegue com estilo e aproveite o evento.", d: "Motorista recebe o casal no rodeio.", p: [20, 70], h: 100 },
        { k: "casamento", n: "Casamento", t: "O dia mais importante merece uma chegada à altura.", d: "Motorista ajuda a noiva a entrar no Nivus.", p: [35, 65], h: 100, mask: { k: "interior", d: "Interior do Nivus.", p: [28], h: 60 } },
        { k: "interior", n: "A viagem", t: "Viaje com tranquilidade. Aproveite cada momento.", d: "Motorista conduz o Nivus à noite.", p: [28, 36], h: 60 },
        { k: "fim", n: "Couto Executivo", t: "", d: "Nivus à noite diante do hotel.", end: true, p: [50, 50], h: 56 }
      ];

      const PHOTOS = {
        "individual": "aeroporto.webp",
        "balada": "festa.webp",
        "rodeio": "rodeio.webp",
        "casamento": "casamento.webp",
        "interior": "dentro_do_carro.webp",
        "fim": "carro.webp"
      };

      const layers = s => `<div class="ly back" style="background:#000"><img class="bg" alt="" src="${PHOTOS[s.k]}" onerror="if(!this.src.endsWith('.jpg'))this.src=this.src.replace('.webp','.jpg')"></div><div class="ly mid"><img class="pic${(s.h || 0) >= 100 ? ' full' : ''}" alt="${s.d}" style="height:${s.h || 56}svh;object-position:${(s.p || [50])[0]}% 50%" src="${PHOTOS[s.k]}" onerror="if(!this.src.endsWith('.jpg'))this.src=this.src.replace('.webp','.jpg')"></div><div class="ly front"></div>`;

      S.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'scene';
        el.setAttribute('role', 'group');
        el.setAttribute('aria-label', `Cena ${i + 1}: ${s.n}`);
        el.innerHTML = layers(s) + (s.mask ? `<div class="reveal">${layers(s.mask)}</div>` : '') +
          (s.end ? `<div class="end"><h2>COUTO<br>EXECUTIVO</h2><p>Seu destino merece uma experiência exclusiva.</p><a class="cta" href="https://wa.me/5519983463457?text=Ol%C3%A1%2C%20quero%20agendar%20com%20a%20Couto%20Executivo" target="_blank" rel="noopener">AGENDAR PELO WHATSAPP</a></div>`
            : `<div class="cap"><small>${s.n}</small><p>${s.t}</p></div>`);
        film.appendChild(el);
      });

      const lite = matchMedia('(prefers-reduced-motion: reduce)').matches ||
                   (navigator.deviceMemory && navigator.deviceMemory <= 2) ||
                   (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) ||
                   /[?&]lite/.test(location.search);

      if (lite) {
        document.body.classList.add('lite');
        return;
      }

      if (!window.gsap || !window.ScrollTrigger) return;
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.config({ ignoreMobileResize: true });

      const mm = gsap.matchMedia();
      mm.add("(max-width: 768px)", () => {
        const sc = [...film.querySelectorAll(':scope > .scene')];
        const L = 10;
        const hud = document.getElementById('hud');
        const bar = document.getElementById('bar');

        const tl = gsap.timeline({
          defaults: { ease: 'none' },
          scrollTrigger: {
            trigger: film,
            start: 'top top',
            end: '+=' + (S.length * 110) + '%',
            pin: true,
            scrub: 1,
            anticipatePin: 1,
            onUpdate: s => {
              if (bar) bar.style.transform = `scaleX(${s.progress})`;
              if (hud) hud.textContent = S[Math.min(S.length - 1, Math.floor(s.progress * S.length))].n;
            }
          }
        });

        sc.forEach((el, i) => {
          const t = i * L;
          const q = c => el.querySelector(':scope > ' + c);
          const back = q('.back'), mid = q('.mid'), front = q('.front'), cap = q('.cap');
          gsap.set(el, { transformPerspective: 900 });

          // Crossfade: a cena entra suavemente sobre a anterior e a anterior some
          if (i === 0) gsap.set(el, { autoAlpha: 1 });
          else {
            tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2 }, t - 1);
            tl.set(sc[i - 1], { autoAlpha: 0 }, t + 1);
          }

          // Camera dolly + Parallax 3D: camadas com velocidades e rotação
          const out = i === S.length - 1;
          const isInterior = S[i].k === 'interior';

          tl.fromTo(back, { scale: out ? 1.45 : 1.05 }, { scale: out ? 1.05 : 1.3, duration: L + 1 }, t - 1);
          tl.fromTo(mid,
            { scale: out ? 1.35 : (isInterior ? 1.02 : 1), xPercent: i === 1 ? -6 : -2, rotationY: -5 },
            { scale: out ? 1 : (isInterior ? 1.06 : (S[i].mask ? 2.4 : 1.6)), xPercent: i === 1 ? 6 : 2, rotationY: 5, duration: L + 1, transformOrigin: S[i].mask ? '50% 60%' : '50% 50%' },
            t - 1
          );
          tl.fromTo(front, { scale: 1 }, { scale: 1.2, duration: L + 1 }, t - 1);

          const pic = mid.querySelector(".pic");
          if (pic && S[i].p) {
            tl.fromTo(pic, { objectPosition: S[i].p[0] + "% 50%" }, { objectPosition: S[i].p[1] + "% 50%", duration: L + 1 }, t - 1);
          }

          if (cap) {
            tl.fromTo(cap, { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 1.6 }, t + 2)
              .to(cap, { autoAlpha: 0, y: -16, duration: 1.2 }, t + 7.4);
          }

          // Mask transition + match cut: passagem pelo vão da porta revela o interior
          const rv = q('.reveal');
          if (rv) {
            tl.set(rv, { autoAlpha: 1 }, t + 4);
            tl.fromTo(rv, { clipPath: 'inset(42% 36% 28% 36% round 12px)' }, { clipPath: 'inset(0% 0% 0% 0% round 0px)', duration: 2.6 }, t + 4);
            tl.fromTo(rv.querySelector('.mid'), { scale: 1.8 }, { scale: 1, duration: 3.4 }, t + 4);
            tl.fromTo(rv.querySelector('.back'), { scale: 1.5 }, { scale: 1.1, duration: 3.4 }, t + 4);
          }

          if (out) {
            const e = el.querySelectorAll('.end h2, .end p, .end .cta');
            e.forEach((x, k) => tl.fromTo(x, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 1.6 }, t + 3 + k * 1.5));
          }
        });

        tl.to({}, { duration: 2 }, L * S.length - 1);
      });
    })();


    function handleQuoteSubmit(e) {
      e.preventDefault();
      const servico = document.getElementById('tipoServico').value;
      const origem = document.getElementById('origem').value;
      const destino = document.getElementById('destino').value;
      const dataHoraRaw = document.getElementById('dataHora').value;

      let dataFormatada = dataHoraRaw;
      if (dataHoraRaw) {
        const dt = new Date(dataHoraRaw);
        if (!isNaN(dt.getTime())) {
          dataFormatada = dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
      }

      const mensagem = `Olá, Couto Executivo! Gostaria de agendar um horário:
*Serviço:* ${servico}
*Origem:* ${origem}
*Destino:* ${destino}
*Data/Hora:* ${dataFormatada}`;

      window.open(`https://wa.me/5519983463457?text=${encodeURIComponent(mensagem)}`, '_blank');
    }
